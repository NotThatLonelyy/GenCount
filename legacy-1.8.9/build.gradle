plugins {
	id 'java'
	id 'gg.essential.loom' version '0.10.0.+'
	id 'dev.architectury.architectury-pack200' version '0.1.3'
}

// Version / group come from ../gradle.properties so both builds always match.
def shared = new Properties()
file('../gradle.properties').withInputStream { shared.load(it) }

group = shared.getProperty('group')
version = shared.getProperty('version')

base {
	archivesName = 'gencount-1.8.9'
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(8)
}

loom {
	silentMojangMappingsLicense()
	forge {
		pack200Provider = new dev.architectury.pack200.java.Pack200Adapter()
	}
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft 'com.mojang:minecraft:1.8.9'
	mappings 'de.oceanlabs.mcp:mcp_stable:22-1.8.9'
	forge 'net.minecraftforge:forge:1.8.9-11.15.1.2318-1.8.9'
}

sourceSets {
	main {
		// Same plain-Java core the 26.x builds use
		java.srcDir file('../core/src/main/java')
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

processResources {
	inputs.property 'version', project.version
	filesMatching('mcmod.info') {
		expand 'version': project.version
	}
}

jar {
	from(file('../LICENSE')) {
		rename { "${it}_gencount" }
	}
}
